
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q9 - Nginx Reverse Proxy</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <h1>Q9: Nginx Reverse Proxy</h1>
    <p>This HTML page and its CSS are served by Nginx.</p>

    <button id="healthButton">Check API Health</button>
    <pre id="healthResult">Health result appears here.</pre>

    <button id="usersButton">Get Users</button>
    <pre id="usersResult">User data appears here.</pre>

    <script>
        document.getElementById('healthButton').addEventListener('click', async () => {
            const response = await fetch('/api/health');
            const data = await response.json();

            document.getElementById('healthResult').textContent =
                JSON.stringify(data, null, 2);
        });

        document.getElementById('usersButton').addEventListener('click', async () => {
            const response = await fetch('/api/users');
            const data = await response.json();

            document.getElementById('usersResult').textContent =
                JSON.stringify(data, null, 2);
        });
    </script>
</body>
</html>
